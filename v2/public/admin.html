<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Управление записями</title><link rel="stylesheet" href="/styles.css"></head><body><main><header><p class="eyebrow">ПАНЕЛЬ МЕНЕДЖЕРА · V2</p><h1>Расписание<br><em>и заявки</em></h1><p>Менеджер управляет специалистами и свободным временем, затем подтверждает или отклоняет заявки.</p></header><section class="panel"><form id="login"><label>Пароль менеджера<input id="password" type="password" autocomplete="current-password" required></label><button>Войти</button><p id="login-error" class="notice"></p></form><div id="dashboard" hidden><nav class="admin-tabs" aria-label="Разделы панели"><button class="active" data-tab="requests">Заявки</button><button class="secondary" data-tab="schedule">Расписание</button><button class="secondary" data-tab="specialists">Специалисты</button></nav><section id="requests-tab" class="admin-section"><div class="toolbar"><b>Очередь заявок</b><button id="refresh" class="secondary">Обновить</button></div><div id="bookings" class="bookings"></div></section><section id="schedule-tab" class="admin-section" hidden><h2>Добавить свободное время</h2><form id="slot-form" class="inline-form"><label>Специалист<select id="slot-specialist" required></select></label><label>Дата и время<input id="slot-start" type="datetime-local" required></label><button>Добавить слот</button></form><p id="slot-message" class="notice"></p><div id="slots" class="schedule-list"></div></section><section id="specialists-tab" class="admin-section" hidden><h2>Добавить специалиста</h2><form id="specialist-form" class="inline-form"><label>Имя<input id="specialist-name" maxlength="80" required></label><label>Короткое описание<input id="specialist-description" maxlength="160"></label><button>Добавить</button></form><p id="specialist-message" class="notice"></p><div id="specialists" class="specialist-list"></div></section></div></section></main><script type="module" src="/admin.js"></script></body></html>
